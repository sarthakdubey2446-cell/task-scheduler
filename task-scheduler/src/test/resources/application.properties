# H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:taskscheduler_test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable RabbitMQ listener during integration tests
spring.rabbitmq.listener.simple.auto-startup=false

# Disable scheduled jobs during integration tests
spring.task.scheduling.enabled=false

# Mail configuration for testing
spring.mail.host=localhost
spring.mail.port=1025

# Disable rate limiting during integration tests
app.rate-limit.enabled=false